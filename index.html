<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./components/src/styles.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Password Generator</title>
</head>

<body>

    <div class="container">
        <img src="https://image.shutterstock.com/image-vector/secure-channel-line-icon-linear-260nw-2476598673.jpg"
            alt="">
        <h1 id="title">Gerador de senhas:</h1>

        <div id="password-container">
            <span id="password"></span>
            <button id="copy">
                <i class="fa-solid fa-copy"></i>
            </button>
        </div>

            <div id="password-itens">
                <div class="item">
                    <input type="number" id="size" name="size">
                    <label for="size">
                        Quantidade de caracteres
                    </label>
                </div>
                <div class="item">
                    <input type="checkbox" name="include-uppercase" id="include-uppercase">
                    <label for="include-uppercase">
                        Incluir letras maiusculas
                    </label>
                </div>
                <div class="item">
                    <input type="checkbox" name="include-lowercase" id="include-lowercase">
                    <label for="include-lowercase">
                        Incluir letras minusculas
                    </label>
                </div>
                <div class="item">
                    <input type="checkbox" name="include-number" id="include-number">
                    <label for="include-uppercase">
                        Incluir números
                    </label>
                </div>
                <div class="item">
                    <input type="checkbox" name="include-special-char" id="include-special-char">
                    <label for="include-uppercase">
                        Incluir carcteres especiais
                    </label>
                </div>
                <button id="generate">Gerar senha -></button>
            </div>
    </div>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./components/src/scripts.js"></script>
</body>

</html>
